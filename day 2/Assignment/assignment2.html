<!DOCTYPE html>
<html>
<body >
<form style="max-width:380px; margin:auto; background:white; padding:20px" action="https://www.youtube.com/" target="_blank">
<h3>User personal information</h3>

<label>Enter your full name</label>
<input type="text" placeholder="Name " required style="width:100%; padding:10px;  margin:8px 0">

<label>Enter your email</label>
<input type="email" placeholder="Email" required style="width:100%; padding:10px; margin:8px 0">

<label>Enter your password</label>
<input type="password" required style="width:100%; padding:10px;  margin:8px 0">

<label>Confirm your password</label>
<input type="password" required style="width:100%; padding:10px;  margin:8px 0">

<label>Enter your gender</label><br>
<input type="radio" name="gender">Male
<input type="radio" name="gender">Female
<input type="radio" name="gender">Others<br>

<label>Enter your Date of Birth</label>
<input type="date" required style="width:100%; padding:10px; margin:8px 0">

<label>Enter your Address:</label>
<textarea placeholder="Enter your address" required style="width:100%; padding:10px; margin:8px 0"></textarea>

<button type="submit" style="padding:10px 20px">Submit</button>
</form>
</body>
</html>
