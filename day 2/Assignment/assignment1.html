<!DOCTYPE html>
<html>
<body style="background:linear-gradient(120deg,#6cf,#a5c);">

<form style="background:white; width:600px; margin:50px auto; padding:25px">

<h1>Registration</h1>

<label>Full Name</label>
<input placeholder="Enter your name">

<label>Username</label>
<input placeholder="Enter username"><br><br>

<label>Email</label>
<input type="email" placeholder="Enter email">

<label>Phone</label>
<input type="tel" placeholder="Enter number"><br><br>

<label>Password</label>
<input type="password" placeholder="Enter password">

<label>Confirm Password</label>
<input type="password" placeholder="Confirm password"><br><br>

<label>Gender</label><br>
<input type="radio" name="button">Male
<input type="radio" name="button">Female
<input type="radio" name="button">Prefer not to say<br><br>

<button style="width:100%; background:linear-gradient(90deg,#6cf,#a5c); color:white; padding:10px">
Register
</button>

</form>
</body>
</html>
